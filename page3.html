<head>

<body>
     <img src="Images/ternixFullLogo.png" alt="Ternix Logo" width="250" height="80" title="Ternix Logo"></td>
        <table border="3" width="100%" height=""> 
      <table>
    <h1>Welcome to Ternix Support</h1>
    <a href="index.html"><img src="Images/Ternix Back To home button.png" alt="Ternix Back To Home" width="250" height=""></a>
                                                 <!-- cursor functions -->
    <script>
        function removeGreenBackground(imgUrl, callback) {
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = imgUrl;
            img.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = 64; 
                canvas.height = 64;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, 64, 64);
                
                const imgData = ctx.getImageData(0, 0, 64, 64);
                const data = imgData.data;
                
                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];
                    if (g > 130 && g > r * 1.3 && g > b * 1.3) {
                        data[i + 3] = 0; 
                    }
                }
                ctx.putImageData(imgData, 0, 0);
                callback(canvas.toDataURL('image/png'));
            };
        }

        window.addEventListener('DOMContentLoaded', () => {
            const randomChoice = Math.floor(Math.random() * 2);
            const chosenCursorUrl = randomChoice === 0 ? 'cursor/Ternix 1 cursor.jpg' : 'cursor/Ternix 2 cursor.jpg';

            removeGreenBackground(chosenCursorUrl, (cleanUrlDefault) => {
                removeGreenBackground('cursor/Ternix 3 cursor.jpg', (cleanUrl3) => {
                    const style = document.createElement('style');
                    style.innerHTML = `
                        *, body { 
                            cursor: url('${cleanUrlDefault}') 0 0, auto !important; 
                        }
                        a, a *, button, button *, input, select, textarea, img, fieldset, legend, video { 
                            cursor: url('${cleanUrl3}') 0 0, pointer !important; 
                        }
                    `;
                    document.head.appendChild(style);
                });
            });
        });
        </script>
</body>
